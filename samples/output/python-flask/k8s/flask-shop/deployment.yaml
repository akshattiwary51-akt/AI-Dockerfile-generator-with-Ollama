apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-shop
  labels:
    app.kubernetes.io/name: flask-shop
    app.kubernetes.io/part-of: flask-shop
    app.kubernetes.io/managed-by: ai-devops-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: flask-shop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flask-shop
        app.kubernetes.io/part-of: flask-shop
