            memory: "512Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: flask-shop-config
        - secretRef:
            name: flask-shop-secrets
        startupProbe:
          httpGet:
            path: "/"
            port: http
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: "/"
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: "/"
            port: http
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
