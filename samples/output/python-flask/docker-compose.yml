# Generated by the AI DevOps Agent. Review before use.
# Secrets are NOT stored here: copy .env.example to .env and fill in the values (keep .env out of git).
services:
  flask-shop:
    build:
      context: "."
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
    - "127.0.0.1:${FLASK_SHOP_HOST_PORT:-5050}:5050"
    healthcheck:
      test:
      - CMD
      - python
      - "-c"
      - "import socket;socket.create_connection(('127.0.0.1',5050),2)"
      interval: "15s"
      timeout: "5s"
      retries: 5
      start_period: "20s"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}"
      PORT: null
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - app_net
    - data_net
  postgres:
    image: "postgres:16-alpine"
    restart: unless-stopped
    volumes:
    - "postgres_data:/var/lib/postgresql/data"
    healthcheck:
      test:
      - CMD-SHELL
      - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "20s"
    networks:
    - data_net
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-app}"
      POSTGRES_DB: "${POSTGRES_DB:-app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
  redis:
    image: "redis:7-alpine"
    restart: unless-stopped
    volumes:
    - "redis_data:/data"
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "20s"
    networks:
    - data_net
networks:
  app_net: {}
  data_net:
    internal: true
volumes:
  postgres_data: {}
  redis_data: {}
